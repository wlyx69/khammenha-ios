name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on macOS
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          grep -m1 objectVersion Khammenha.xcodeproj/project.pbxproj
          xcodebuild -list -project Khammenha.xcodeproj

      - name: Build without code signing
        run: |
          set -o pipefail
          xcodebuild \
            -project Khammenha.xcodeproj \
            -scheme Khammenha \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tee build.log | grep -E "error:|warning: .*Swift|BUILD|Compiling|Linking|CompileAssetCatalog" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP_PATH"
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -qr Khammenha-unsigned.ipa Payload
          ls -la Khammenha-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Khammenha-unsigned-ipa
          path: dist/Khammenha-unsigned.ipa
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/Khammenha-unsigned.ipa \
            --repo "${{ github.repository }}" \
            --title "IPA build ${{ github.run_number }}" \
            --notes "Unsigned IPA. Sign it with your own tool (ESign, Sideloadly, AltStore...) before installing."
